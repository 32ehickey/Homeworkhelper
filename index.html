<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Games Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Web Games Portal</h1>
    <input type="text" id="searchBar" placeholder="Search games...">
  </header>

  <main>
    <div id="gameGrid" class="game-grid"></div>
  </main>

  <!-- Game Player Modal / View -->
  <div id="playerModal" class="modal hidden">
    <div class="modal-content">
      <button id="closeBtn">Close Game</button>
      <iframe id="gameFrame" src="" allowfullscreen></iframe>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
